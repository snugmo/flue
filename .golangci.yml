version: "2"
formatters:
  # gofmt: formatting (keeps the tree gofmt-clean in CI, e.g. the
  # comment-block alignment drift); runs on all files including tests.
  enable: [gofmt]
linters:
  # errcheck: unchecked errors (the classic Go footgun); gosec: security
  # findings; govet: all vet analyzers (printf, lostcancel, unreachable, …);
  # staticcheck: SA/S/ST correctness and style rules plus unused-code
  # detection; ineffassign: assigned-but-unused values; nilerr: err != nil
  # but a nil error returned; predeclared: shadowed builtins (index, error,
  # len, min, max, …); misspell: typos in comments and strings (the
  # codebase is comment-heavy); sloglint (static-msg on, below): both
  # binaries log exclusively through slog, so a non-constant message is
  # the sign of format-string thinking about an API that takes a literal
  # message plus key/value pairs (see the slog note in AGENTS.md). The
  # one wrapper that legitimately forwards a dynamic msg (the
  # refusalLimiter in cmd/flue/lograte.go, rate-limiting refusal
  # warnings) carries //nolint:sloglint on its two log.Log calls —
  # every caller passes a constant message;
  # unconvert: unnecessary type conversions; forcetypeassert: unchecked
  # type assertions (a panic in the filter or the fd handover paths would
  # be a real bug). govet's own slog analyzer already catches a slice
  # passed to slog's variadic args without the spread, so asasalint adds
  # nothing here (there is no other ...any variadic in the tree).
  # Deliberately not enabled: dupl (the
  # flue/flue-broker duplication is deliberate, see
  # docs/duplication-policy.md), gochecknoglobals (flag and test-harness
  # package vars are the norm here), revive/gocritic (opinionated style
  # beyond this repo's conventions), bodyclose/noctx/contextcheck (no
  # net/http), dogsled (ssh.ParseAuthorizedKey returns five values and
  # the repo must ignore three of them), gofumpt (a style tier beyond
  # this repo's gofmt convention), wrapcheck/err113 (the error style is
  # deliberate plain %v/%w mixing), lll/varnamelen/godot (opinionated
  # typography), copyloopvar (Go 1.27 loopvar makes it pure noise).
  enable: [errcheck, forcetypeassert, gosec, govet, ineffassign, misspell, nilerr, predeclared, sloglint, staticcheck, unconvert]
  settings:
    # static-msg: the message must be a constant string (off by default).
    # no-mixed-args is on by default and stays on.
    sloglint:
      static-msg: true
  exclusions:
    rules:
      # errcheck and gosec are deliberately off in tests: test helpers
      # close connections and open temp files without checking every
      # error (cleanup runs in t.Cleanup), and their fixture files
      # (temp-dir scripts, key blobs) are local and trusted.
      # forcetypeassert is off in tests too: the fixtures are conns the
      # tests create themselves, and a bad fixture type panicking the
      # assertion is the failure mode the test wants.
      - path: _test\.go
        linters: [errcheck, forcetypeassert, gosec]
