# Release — build the flue image when a git tag is pushed and publish
# it as a GitHub Release. One build of the Containerfile (golang build
# stage compiles the static flue binary, FROM scratch final stage ships
# it at /flue — built once per platform, assembled into a manifest
# list) is the single source of truth:
#
#   - the brokers (one per architecture, from the Containerfile's
#     flue-broker stage) are exported, attested, and cosign-signed
#     (Sigstore keyless) — the signature is embedded in every flue as
#     the broker's sigstore bundle, so a consumer who recovers a
#     broker from any flue can verify it offline (flue broker
#     sigstore-bundle + cosign verify-blob --bundle);
#   - the image is pushed to ghcr.io/snugmo/flue, attested with SLSA
#     build provenance (one attestation per architecture), and signed
#     (Sigstore keyless);
#   - the release assets are the image's own bytes: each architecture's
#     manifest is pulled from the registry and the single /flue file is
#     copied out, so a downloaded binary is byte-identical to the one
#     that was pushed, signed, and attested.
#
# The brokers are signed before the image is built, and each
# platform's image is built with that platform's signed bundle in its
# build context — a buildx invocation carries one context (shared by
# all of its platforms), so the multi-arch release is two single-
# platform builds whose outputs are assembled into the manifest list
# with `docker buildx imagetools create`.
#
# Trigger: push a tag like `v1.2.3` (any tag matching `v*`).
#
# Runs on ubuntu-24.04, pinned (not ubuntu-latest): ubuntu-latest migrates
# to Ubuntu 26.04 in stages from 2026-10-19, which would turn the runner
# image into a moving target mid-release (24.04 or 26.04 depending on
# the day a tag lands) and change the OS/kernel/toolchain under the signed
# and attested build. Pinning keeps the release reproducible; adopt
# ubuntu-26.04 deliberately in a later release once tested here.
# (github.com/actions/runner-images#14748)
#
# Every action is pinned to a commit SHA (the tag the SHA came from is
# kept in a trailing comment): this workflow signs and attests releases,
# so a mutable tag on a third-party repo is a supply-chain hole, and the
# SHAs make each release auditable down to the exact action code that ran.
# Re-pinning is a deliberate, reviewed change. The Node 24 majors (the
# older ones run on the deprecated Node 20 runtime) are the baseline.
#
# The checkouts use persist-credentials: false: no job pushes to the git
# remote (the release job's tag fetch works unauthenticated — the repo is
# public), so the GITHUB_TOKEN never sits in .git/config inside a
# workspace (the image job's build contexts tar the workspace minus .git,
# but not taking the risk is the point).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # flue go:embeds the built broker (cmd/flue/embed.go) and its
      # sigstore bundle: the broker must be built to its embed path, and
      # the bundle must exist (the committed placeholder template when no
      # signed bundle is present) before any package load succeeds.
      - name: Build broker (embed source)
        env:
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o cmd/flue/flue-broker.bin ./cmd/flue-broker
      - name: Place the placeholder broker bundle (embed source)
        run: test -f cmd/flue/flue-broker.sigstore.json || cp cmd/flue/flue-broker.sigstore.json.placeholder cmd/flue/flue-broker.sigstore.json
      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build broker (embed source)
        env:
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o cmd/flue/flue-broker.bin ./cmd/flue-broker
      - name: Place the placeholder broker bundle (embed source)
        run: test -f cmd/flue/flue-broker.sigstore.json || cp cmd/flue/flue-broker.sigstore.json.placeholder cmd/flue/flue-broker.sigstore.json
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0

  image:
    needs: [test]
    runs-on: ubuntu-24.04
    # This job-level block replaces the top-level permissions for this
    # job, so it must list everything the job needs:
    #   actions: write          upload the release binaries as an artifact
    #   contents: read           check out the source and the Containerfile
    #   packages: write          push the images, the cosign signatures, and
    #                            the registry-pushed attestations to GHCR
    #   id-token: write          mint the OIDC token exchanged for the
    #                            Sigstore signing certificate (broker
    #                            sign-blobs + image sign)
    #   attestations: write      persist the attestations in GitHub's store
    #   artifact-metadata: write create the images' storage records
    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # One fixed image name for every release (no metadata-action: the
      # name never changes and the tags are explicit below).
      IMAGE: ghcr.io/snugmo/flue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Image refs
        id: refs
        run: |
          set -euo pipefail
          # The image tag strips the leading v from the release tag
          # (v1.2.3 -> 1.2.3), matching the stamped binary version.
          tag="${GITHUB_REF_NAME#v}"
          {
            echo "tag=${tag}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # The toolchain the release's golang stages pin to: the
            # go.mod `go` directive. Every buildx invocation in this
            # job (the broker export, then the per-arch image builds)
            # runs its golang stages at this exact version, so the
            # broker rebuilt inside the image is byte-identical to the
            # broker exported and signed above — independent of the
            # build cache or of a new golang:1.27.x patch landing.
            echo "goversion=$(awk '/^go /{print $2}' go.mod)"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The SHA is cosign-installer v4.1.2: the repo has no bare "v4"
      # tag (only v4.0.0+ and a v3), so @v4 would not resolve. Installed
      # before the broker sign (below) as well as the image sign.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # The brokers are not release assets (each ships inside its
      # architecture's flue), but both are exported here, before any
      # image build, so they can be signed (below): the signed bundles
      # are what the per-arch image builds embed. Each exported file is
      # the rootfs of the Containerfile's flue-broker stage, built for
      # linux/<arch> — the same file the flue build stage's COPY --from
      # consumes as the go:embed source, so the attested and signed
      # broker is provably the one injected at build time; the verify
      # steps below close the loop end to end.
      - name: Export the broker binaries from the broker stage
        env:
          GOVERSION: ${{ steps.refs.outputs.goversion }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # One buildx invocation per architecture: --platform
          # selects which platform's chain to build, and --target
          # stops at the flue-broker stage. GOVERSION pins the
          # golang stage to one toolchain for this whole job (see
          # Image refs), so these bytes are what the image builds
          # below rebuild.
          for arch in amd64 arm64; do
            docker buildx build -f Containerfile \
              --target flue-broker \
              --platform "linux/${arch}" \
              --build-arg VERSION="${tag}" \
              --build-arg GOVERSION="${GOVERSION}" \
              --output "type=local,dest=dist/brokers/${arch}" .
          done
      # One sigstore bundle per broker, next to it: the bundle carries
      # the signature, certificate, and chain, so a consumer who
      # recovers the broker from any flue verifies it offline (cosign
      # verify-blob <file> --bundle <file>.sigstore.json) — no registry or
      # network lookup needed. The bundle is embedded in flue (below),
      # so the extracted broker and its bundle always travel together.
      # The identity is this workflow file at the pushed ref, under
      # the GitHub Actions OIDC issuer (same identity as the image and
      # release-binary signatures).
      - name: Sign the brokers (Sigstore keyless)
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            cosign sign-blob --yes \
              --bundle "dist/brokers/${arch}/flue-broker.sigstore.json" \
              "dist/brokers/${arch}/flue-broker"
          done
      # Each platform's flue embeds that platform's broker and bundle,
      # and a buildx invocation carries one context (shared by all of
      # its platforms), so the image is built once per platform, each
      # with its own context: a copy of the checkout with that
      # platform's signed bundle placed on the go:embed path
      # (cmd/flue/flue-broker.sigstore.json — the Containerfile's build
      # stage consumes the context copy, falling back to the committed
      # placeholder template only when no bundle is present). The two
      # single-platform pushes are assembled into the release's
      # manifest list below.
      - name: Prepare the per-platform build contexts
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "ctx/${arch}"
            tar --exclude=.git --exclude=ctx -cf - . | tar -xf - -C "ctx/${arch}"
            cp "dist/brokers/${arch}/flue-broker.sigstore.json" "ctx/${arch}/cmd/flue/flue-broker.sigstore.json"
          done
      # No QEMU: the Containerfile's golang stages are pinned to
      # $BUILDPLATFORM and each compiles its own target platform
      # (Go cross-compilation is native), so every platform build
      # runs natively on the runner.
      - name: Build and push the amd64 image
        id: build-amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ctx/amd64
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.refs.outputs.tag }}-amd64
          build-args: |
            VERSION=${{ steps.refs.outputs.tag }}
            GOVERSION=${{ steps.refs.outputs.goversion }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.refs.outputs.created }}
      - name: Build and push the arm64 image
        id: build-arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ctx/arm64
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.refs.outputs.tag }}-arm64
          build-args: |
            VERSION=${{ steps.refs.outputs.tag }}
            GOVERSION=${{ steps.refs.outputs.goversion }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.refs.outputs.created }}
      # Assemble the two per-arch images into the release's manifest
      # list (the tag and latest). imagetools create copies the
      # existing child manifests into a new index — no rebuild, no
      # re-upload of blobs — but its stdout is progress output, so the
      # list's digest is resolved separately via inspect's default
      # output (the top-level "Digest:" line; the --format template
      # fields vary across buildx versions). The per-arch tags stay
      # published alongside the list: they are the imagetools sources
      # and let consumers pull one arch directly.
      - name: Assemble the multi-arch manifest list
        id: list
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            -t "${IMAGE}:${tag}" -t "${IMAGE}:latest" \
            "${IMAGE}:${tag}-amd64" "${IMAGE}:${tag}-arm64"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${tag}" | awk '/^Digest:/{print $2}')"
          if [[ -z "$digest" || "$digest" == "null" ]]; then
            echo "ERROR: could not resolve the manifest-list digest for ${IMAGE}:${tag}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      # One SLSA build-provenance attestation per per-arch image (the
      # GHA-workflow build type: source = this repo at the pushed
      # commit, builder = this workflow): stored in GitHub's
      # attestation store and pushed to the registry next to each
      # child manifest. (There is no "provenance" input — that would be
      # rejected as unexpected; with neither predicate nor
      # predicate-path, attest@v4 generates the SLSA provenance
      # predicate from the workflow's OIDC claims, which is why it
      # works per platform the same way it did for the manifest list.)
      - name: Attest the amd64 image (SLSA provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build-amd64.outputs.digest }}
          push-to-registry: true
          create-storage-record: true
      - name: Attest the arm64 image (SLSA provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build-arm64.outputs.digest }}
          push-to-registry: true
          create-storage-record: true
      - name: Sign the image (Sigstore keyless)
        run: |
          set -euo pipefail
          # --recursive signs the manifest-list (umbrella) digest AND each
          # per-platform child manifest. That covers every tag pointing at
          # the list (the release tag and latest) and also leaves a
          # signature object next to each arch image, so a per-arch
          # cosign verify (resolving to a child digest) matches — the
          # umbrella signature alone pins the child digests but stores no
          # signature at the child for that verify.
          cosign sign --yes --recursive "${IMAGE}@${{ steps.list.outputs.digest }}"
      # The release binaries are the image's own bytes: resolve the
      # manifest-list digest the assemble step created down to each arch's
      # child manifest, pull that, and copy the single /flue file out —
      # byte-identical to the pushed, signed, attested image. Each arch
      # is pulled by its OWN child digest (not the list digest twice),
      # which avoids docker's "cannot overwrite digest" error: a second
      # --platform pull of the same list digest is refused.
      - name: Extract release binaries from the image
        env:
          DIGEST: ${{ steps.list.outputs.digest }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # Fetch the index once. `imagetools inspect --raw` emits the
          # manifest-list JSON (buildx-native, handles OCI media types);
          # `--format` is a Go template, not a "json" keyword, so it must
          # not be used here.
          index_json="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          for arch in amd64 arm64; do
            child="$(jq -r --arg a "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest' <<<"$index_json" 2>/dev/null || true)"
            if [[ -z "$child" || "$child" == "null" ]]; then
              echo "ERROR: no linux/${arch} child manifest under ${IMAGE}@${DIGEST} (or the index did not parse as JSON)" >&2
              echo "--- docker buildx imagetools inspect --raw ---" >&2
              printf '%s\n' "$index_json" >&2
              exit 1
            fi
            docker pull "${IMAGE}@${child}"
            id="$(docker create "${IMAGE}@${child}")"
            docker cp "${id}:/flue" "dist/flue_${tag}_linux_${arch}"
            docker rm "${id}" >/dev/null
            chmod 0755 "dist/flue_${tag}_linux_${arch}"
            sha256sum "dist/flue_${tag}_linux_${arch}"
          done
      # The runner's own architecture, remapped to a Go/docker arch
      # name (AMD64/X64->amd64, ARM64->arm64). Named FLUE_ARCH, not
      # RUNNER_ARCH: the runner injects its own RUNNER_ARCH into
      # every step, and env entries that shadow a runner-reserved
      # name do not reliably win the environment merge — the step
      # kept seeing the runner-native value (X64) instead of the
      # remapped one. GitHub's expression language has no
      # case-folding function, so the remap is an &&/|| chain over
      # runner.arch. The 'X64' case is not in the official docs but
      # is what the actual runner images report; keep both
      # spellings. Any other value (e.g. a 32-bit 'ARM') passes
      # through raw and is used verbatim. No uname/shell needed to
      # detect the arch: the runner reports it. (Shared by the two
      # verify steps below.)
      - name: Verify the embedded broker is byte-identical
        env:
          FLUE_ARCH: ${{ runner.arch == 'AMD64' && 'amd64' || runner.arch == 'X64' && 'amd64' || runner.arch == 'ARM64' && 'arm64' || runner.arch }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # Close the loop end to end: run the flue binary matching THIS
          # runner's architecture to extract its embedded broker, which
          # must be byte-identical to that architecture's file above —
          # the same file its build stage COPY --from consumed. Only the
          # runner-native binary can execute here (no QEMU), so it's the
          # one edge we verify; the other arch holds by the same
          # COPY --from symmetry.
          ./dist/flue_${tag}_linux_${FLUE_ARCH} broker executable /tmp/flue-broker-embedded
          cmp /tmp/flue-broker-embedded "dist/brokers/${FLUE_ARCH}/flue-broker"
      - name: Verify the embedded broker bundle is byte-identical
        env:
          FLUE_ARCH: ${{ runner.arch == 'AMD64' && 'amd64' || runner.arch == 'X64' && 'amd64' || runner.arch == 'ARM64' && 'arm64' || runner.arch }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # The native-arch flue extracts its embedded broker bundle; it
          # must be byte-identical to the bundle signed above for that
          # architecture's broker — the one its build stage's context
          # copy embedded. So the extracted broker and its bundle are
          # exactly the signed pair: cosign verify-blob --bundle passes.
          ./dist/flue_${tag}_linux_${FLUE_ARCH} broker sigstore-bundle /tmp/flue-broker-bundle
          cmp /tmp/flue-broker-bundle "dist/brokers/${FLUE_ARCH}/flue-broker.sigstore.json"
      - name: Attest the amd64 broker
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ github.workspace }}/dist/brokers/amd64/flue-broker
      - name: Attest the arm64 broker
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ github.workspace }}/dist/brokers/arm64/flue-broker
      # Only the flue binaries go in the artifact (the broker and its
      # bundle are embedded in them and stay out of the release
      # download list and SHA256SUMS). The file names use the stripped
      # release tag (steps.refs.outputs.tag = the tag without its
      # leading v), matching the dist/flue_<tag>_linux_<arch> files the
      # extract step above produced — github.ref_name keeps the v and
      # would point at paths that do not exist.
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flue_${{ steps.refs.outputs.tag }}
          path: |
            dist/flue_${{ steps.refs.outputs.tag }}_linux_amd64
            dist/flue_${{ steps.refs.outputs.tag }}_linux_arm64

  release:
    needs: [image]
    runs-on: ubuntu-24.04
    permissions:
      # Download the build artifact the release is made from.
      actions: read
      # Publish the release and upload the assets.
      contents: write
      # Mint the OIDC token cosign's keyless (fulcio) signing needs.
      id-token: write
    steps:
      # The tag's commit — and, via the fetch in the next step, the
      # annotated tag's message: the release body comes from the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The release body is the annotated tag's message (the curated
      # release notes). GitHub's auto-generated notes (a changelog
      # link and a commit list) are not a substitute, so softprops'
      # generate_release_notes stays on only for lightweight tags
      # that carry no message of their own.
      - name: Read the tag's release notes
        id: notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Make sure the annotated tag object itself is present,
          # not just the commit it points at (a lightweight tag
          # fetches only the commit).
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}" --force
          if [[ "$(git cat-file -t "refs/tags/${tag}")" == "tag" ]]; then
            # The tag object is a header (object/type/tag/tagger),
            # one blank line, then the message: keep the message.
            git cat-file -p "refs/tags/${tag}" | sed -n '/^$/,$p' | tail -n +2 > release-notes.md
            echo "file=release-notes.md" >> "${GITHUB_OUTPUT}"
            echo "annotated=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
      - name: Flatten
        run: find artifacts -type f -exec mv {} . \;
      # The SHA is cosign-installer v4.1.2: the repo has no bare "v4"
      # tag (only v4.0.0+ and a v3), so @v4 would not resolve.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the release binaries (Sigstore keyless)
        run: |
          set -euo pipefail
          # One bundle per binary, next to it: the bundle carries the
          # signature, certificate, and chain, so a consumer verifies
          # offline with cosign verify-blob <file> --bundle <file>.sigstore.json
          # — no registry or network lookup needed. The glob expands once,
          # so the .sigstore.json files created here are not iterated.
          for f in flue_*; do
            [[ -f "$f" ]] || continue
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      # After signing, so the sums cover the bundles as well.
      - name: Generate SHA256SUMS
        run: sha256sum flue_* > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # flue_* covers the binaries and their .sigstore.json bundles.
          files: |
            flue_*
            SHA256SUMS
          # The body is the tag's curated notes when the tag is
          # annotated; with a lightweight tag (no notes file written)
          # fall back to GitHub's auto-generated notes, which
          # softprops appends while generate_release_notes is on.
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.annotated == 'true' && 'false' || 'true' }}
