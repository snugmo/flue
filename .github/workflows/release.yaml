# Release — build the static flue binary when a git tag is pushed and
# publish it as a GitHub Release. The flue-broker is embedded in the flue
# binary (recoverable via `flue extract-broker`), so it is not a separate
# release asset; this workflow still builds it (to the go:embed path),
# verifies the embed matches the build source, and sigstore-attests the
# broker (SLSA provenance in the GitHub attestation store) so anyone who
# extracts it can verify it was built by this workflow.
#
# The flue binary is also published as the OCI image ghcr.io/snugmo/flue:
# a minimal static distribution (FROM scratch, just the /flue binary, with
# flue-broker embedded in it). The image job builds the repo's Containerfile
# for both architectures (its build stage compiles the static binary; the
# final stage is the scratch distribution), signs it (Sigstore keyless),
# and attests it with SLSA build provenance.
#
# Trigger: push a tag like `v1.2.3` (any tag matching `v*`).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # flue go:embeds the built broker (cmd/flue/embed.go), so the broker
      # must be built to its embed path before any package load succeeds.
      - name: Build broker (embed source)
        env:
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o cmd/flue/flue-broker.bin ./cmd/flue-broker
      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build broker (embed source)
        env:
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o cmd/flue/flue-broker.bin ./cmd/flue-broker
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  build:
    needs: [test]
    runs-on: ubuntu-latest
    # This job-level block replaces the top-level permissions for this job,
    # so it must list everything the job needs:
    #   actions: write         upload the build artifact
    #   contents: read        checkout the source
    #   id-token: write       mint the OIDC token exchanged for the Sigstore
    #                         signing certificate (Attest broker step)
    #   attestations: write   persist the attestation in GitHub's store
    permissions:
      actions: write
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          arch="${{ matrix.goarch }}"
          # The broker is built first, to the go:embed path, because flue
          # embeds it; consumers get it back via `flue extract-broker`,
          # so it is not published as a separate release asset.
          # The tag (minus the leading v) is stamped into both binaries,
          # shown by `flue version` / `flue-broker -version`.
          GOARCH="${arch}" go build -ldflags="-s -w -X main.version=${ver#v}" -o cmd/flue/flue-broker.bin ./cmd/flue-broker
          out="dist"
          mkdir -p "${out}"
          # The exact bytes that get embedded in this arch's flue, kept
          # aside for the attestation.
          cp cmd/flue/flue-broker.bin "${out}/flue-broker_${ver}_linux_${arch}"
          # Flat, version+arch-named release asset (no tgz wrapper):
          # download, chmod +x, run.
          GOARCH="${arch}" go build -ldflags="-s -w -X main.version=${ver#v}" -o "${out}/flue_${ver}_linux_${arch}" ./cmd/flue
      # When the runner arch matches the build target (amd64 on X64,
      # arm64 on ARM64) the release binary can execute; the verify steps
      # run the actual artifact. On a mismatch (arm64 cross-compiled on
      # an X64 runner) these are skipped — the attestation and
      # SHA256SUMS still pin the shipped bytes.
      - name: Verify extract-broker identity
        if: ${{ (runner.arch == 'X64' && matrix.goarch == 'amd64') || (runner.arch == 'ARM64' && matrix.goarch == 'arm64') }}
        run: |
          set -euo pipefail
          flue="dist/flue_${GITHUB_REF_NAME}_linux_${{ matrix.goarch }}"
          tmp="$(mktemp -d)"
          "${flue}" extract-broker "${tmp}/flue-broker"
          want="$(sha256sum cmd/flue/flue-broker.bin | awk '{print $1}')"
          got="$(sha256sum "${tmp}/flue-broker" | awk '{print $1}')"
          if [ "${want}" != "${got}" ]; then
            printf 'extract-broker does not match the embed source:\n  embed:     %s\n  extracted: %s\n' "${want}" "${got}"
            exit 1
          fi
          echo "extract-broker sha256 matches: ${got}"
      - name: Verify broker-sha256
        if: ${{ (runner.arch == 'X64' && matrix.goarch == 'amd64') || (runner.arch == 'ARM64' && matrix.goarch == 'arm64') }}
        run: |
          set -euo pipefail
          flue="dist/flue_${GITHUB_REF_NAME}_linux_${{ matrix.goarch }}"
          got="$("${flue}" broker-sha256)"
          want="$(sha256sum cmd/flue/flue-broker.bin | awk '{print $1}')"
          if [ "${got}" != "${want}" ]; then
            printf 'broker-sha256 does not match the embed source:\n  reported: %s\n  actual:   %s\n' "${got}" "${want}"
            exit 1
          fi
          echo "broker-sha256 matches the embed source: ${got}"
      - name: Attest broker
        uses: actions/attest@v4
        with:
          subject-path: ${{ github.workspace }}/dist/flue-broker_${{ github.ref_name }}_linux_${{ matrix.goarch }}
        # The broker is not a release asset, but it is still attested here —
        # in the job that built it — with a SLSA build-provenance predicate
        # signed by a short-lived Sigstore certificate (public-good instance
        # for this public repo). The attestation lands in GitHub's
        # attestation store, keyed by the file's sha256 digest, so a
        # consumer who recovers the broker from any flue binary can verify
        # it without the broker ever appearing in the release download list:
        #
        #   flue extract-broker ./flue-broker
        #   gh attestation verify ./flue-broker --source snugmo/flue
      - name: Attest flue
        uses: actions/attest@v4
        with:
          subject-path: ${{ github.workspace }}/dist/flue_${{ github.ref_name }}_linux_${{ matrix.goarch }}
      # Only the flue binary goes in the artifact (the broker is embedded
      # in it), and the release job publishes it. The broker is still not
      # a release asset — it stays out of the release download list and
      # out of SHA256SUMS.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flue_${{ github.ref_name }}_${{ matrix.goarch }}
          path: |
            dist/flue_${{ github.ref_name }}_linux_${{ matrix.goarch }}

  image:
    needs: [build]
    runs-on: ubuntu-latest
    # This job-level block replaces the top-level permissions for this job,
    # so it must list everything the job needs:
    #   contents: read           check out the source and the Containerfile
    #   packages: write          push the image, the cosign signature, and
    #                            the registry-pushed attestation to GHCR
    #   id-token: write          mint the OIDC token exchanged for the
    #                            Sigstore signing certificate (sign + attest)
    #   attestations: write      persist the attestation in GitHub's store
    #   artifact-metadata: write create the image's storage record
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # One fixed image name for every release (no metadata-action: the
      # name never changes and the tags are explicit below).
      IMAGE: ghcr.io/snugmo/flue
    steps:
      - uses: actions/checkout@v4
      - name: Image refs
        id: refs
        run: |
          set -euo pipefail
          # The image tag strips the leading v from the release tag
          # (v1.2.3 -> 1.2.3), matching the stamped binary version.
          tag="${GITHUB_REF_NAME#v}"
          {
            echo "tag=${tag}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          # No QEMU: the Containerfile's build stage is pinned to
          # linux/amd64 and cross-compiles for the target architecture
          # (Go cross-compilation is native), so every platform build
          # runs natively on the amd64 runner.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.refs.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.refs.outputs.tag }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.refs.outputs.created }}
      - name: Attest the image (SLSA provenance)
        uses: actions/attest@v4
        with:
          # provenance: true makes the action generate the SLSA
          # build-provenance predicate for this buildx run (the same
          # toolkit as the binary attestations in the build job). The
          # subject is the image name without a tag, identified by the
          # manifest-list digest; push-to-registry stores it as a cosign
          # attestation in the image's own repo, next to the signature.
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          provenance: true
          push-to-registry: true
          create-storage-record: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v4
      - name: Sign the image (Sigstore keyless)
        run: |
          set -euo pipefail
          # One keyless signature for the whole multi-arch image: cosign
          # signs the manifest list by digest, so every tag pointing at
          # this digest (the release tag and latest) is covered.
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      # Download the build artifacts the release is made from.
      actions: read
      # Publish the release and upload the assets.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: find artifacts -type f -exec mv {} . \;
      - name: Generate SHA256SUMS
        run: sha256sum flue_* > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flue_*
            SHA256SUMS
          generate_release_notes: true
