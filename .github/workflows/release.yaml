# Release — build the flue image when a git tag is pushed and publish
# it as a GitHub Release. One multi-arch build of the Containerfile
# (golang build stage compiles the static flue binary, FROM scratch
# final stage ships it at /flue) is the single source of truth:
#
#   - the image is pushed to ghcr.io/snugmo/flue, attested with SLSA
#     build provenance, and signed (Sigstore keyless);
#   - the release assets are the image's own bytes: each architecture's
#     manifest is pulled from the registry and the single /flue file is
#     copied out, so a downloaded binary is byte-identical to the one
#     that was pushed, signed, and attested;
#   - the embedded flue-broker (not a separate asset — it ships inside
#     every flue) is extracted from the native-arch binary and
#     sigstore-attested, so a consumer who recovers it can verify it
#     was built by this workflow.
#
# Trigger: push a tag like `v1.2.3` (any tag matching `v*`).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # flue go:embeds the built broker (cmd/flue/embed.go), so the broker
      # must be built to its embed path before any package load succeeds.
      - name: Build broker (embed source)
        env:
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o cmd/flue/flue-broker.bin ./cmd/flue-broker
      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build broker (embed source)
        env:
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o cmd/flue/flue-broker.bin ./cmd/flue-broker
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  image:
    needs: [test]
    runs-on: ubuntu-latest
    # This job-level block replaces the top-level permissions for this
    # job, so it must list everything the job needs:
    #   actions: write          upload the release binaries as an artifact
    #   contents: read           check out the source and the Containerfile
    #   packages: write          push the image, the cosign signature, and
    #                            the registry-pushed attestation to GHCR
    #   id-token: write          mint the OIDC token exchanged for the
    #                            Sigstore signing certificate (sign + attest)
    #   attestations: write      persist the attestations in GitHub's store
    #   artifact-metadata: write create the image's storage record
    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # One fixed image name for every release (no metadata-action: the
      # name never changes and the tags are explicit below).
      IMAGE: ghcr.io/snugmo/flue
    steps:
      - uses: actions/checkout@v4
      - name: Image refs
        id: refs
        run: |
          set -euo pipefail
          # The image tag strips the leading v from the release tag
          # (v1.2.3 -> 1.2.3), matching the stamped binary version.
          tag="${GITHUB_REF_NAME#v}"
          {
            echo "tag=${tag}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          # No QEMU: the Containerfile's build stage is pinned to
          # linux/amd64 and cross-compiles for the target architecture
          # (Go cross-compilation is native), so every platform build
          # runs natively on the amd64 runner.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.refs.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.refs.outputs.tag }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.refs.outputs.created }}
      - name: Attest the image (SLSA provenance)
        uses: actions/attest@v4
        with:
          # provenance: true makes the action generate the SLSA
          # build-provenance predicate for this buildx run. The subject
          # is the image name without a tag, identified by the
          # manifest-list digest; push-to-registry stores it as a cosign
          # attestation in the image's own repo, next to the signature.
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          provenance: true
          push-to-registry: true
          create-storage-record: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v4
      - name: Sign the image (Sigstore keyless)
        run: |
          set -euo pipefail
          # One keyless signature for the whole multi-arch image: cosign
          # signs the manifest list by digest, so every tag pointing at
          # this digest (the release tag and latest) is covered.
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      # The release binaries are the image's own bytes: pull each
      # architecture's manifest by the manifest-list digest the build
      # step just pushed — not the symbolic tag, which pins the
      # extraction to the exact pushed, signed, and attested artifact —
      # and copy the single /flue file out of it, byte-identical.
      - name: Extract release binaries from the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            docker pull --platform "linux/${arch}" "${IMAGE}@${DIGEST}"
            id="$(docker create --platform "linux/${arch}" "${IMAGE}@${DIGEST}")"
            docker cp "${id}:/flue" "dist/flue_${tag}_linux_${arch}"
            docker rm "${id}" >/dev/null
            chmod 0755 "dist/flue_${tag}_linux_${arch}"
            sha256sum "dist/flue_${tag}_linux_${arch}"
          done
      # The brokers are not release assets (each ships inside its
      # architecture's flue), but both are attested here (attestation
      # records in GitHub's attestation store, keyed by each file's
      # sha256), so a consumer who recovers a broker from any flue —
      # any architecture — can verify it without it ever appearing in
      # the release download list:
      #
      #   flue extract-broker ./flue-broker
      #   gh attestation verify ./flue-broker --source snugmo/flue
      #
      # Each attested file is the rootfs of the Containerfile's
      # flue-broker-<arch> stage — the same file the flue build
      # stage's COPY --from consumes as the go:embed source — so the
      # attested broker is provably the one injected at build time;
      # the cross-check below closes the loop end to end.
      - name: Export the broker binaries from the broker stages
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # One buildx invocation per flue-broker-<arch> stage: every
          # step is a cache hit from the image build above, so only
          # the stage's single COPY runs, and the local output writes
          # that architecture's broker to dist/brokers/<arch>/.
          for arch in amd64 arm64; do
            docker buildx build -f Containerfile \
              --target "flue-broker-${arch}" \
              --build-arg VERSION="${tag}" \
              --output "type=local,dest=dist/brokers/${arch}" .
          done
      - name: Verify the embedded broker is byte-identical
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # Close the loop end to end: the amd64 flue pulled from the
          # pushed image must extract a broker byte-identical to the
          # file about to be attested — the same file its build stage
          # COPY --from consumed (the arm64 pairing is the same edge).
          ./dist/flue_${tag}_linux_amd64 extract-broker /tmp/flue-broker-embedded
          cmp /tmp/flue-broker-embedded dist/brokers/amd64/flue-broker
      - name: Attest the amd64 broker
        uses: actions/attest@v4
        with:
          subject-path: ${{ github.workspace }}/dist/brokers/amd64/flue-broker
      - name: Attest the arm64 broker
        uses: actions/attest@v4
        with:
          subject-path: ${{ github.workspace }}/dist/brokers/arm64/flue-broker
      # Only the flue binaries go in the artifact (the broker is
      # embedded in them and stays out of the release download list
      # and SHA256SUMS).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flue_${{ github.ref_name }}
          path: |
            dist/flue_${{ github.ref_name }}_linux_amd64
            dist/flue_${{ github.ref_name }}_linux_arm64

  release:
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      # Download the build artifact the release is made from.
      actions: read
      # Publish the release and upload the assets.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: find artifacts -type f -exec mv {} . \;
      - name: Generate SHA256SUMS
        run: sha256sum flue_* > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flue_*
            SHA256SUMS
          generate_release_notes: true
