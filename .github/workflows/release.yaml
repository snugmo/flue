# Release — build the static flue binary when a git tag is pushed and
# publish it as a GitHub Release. The flue-broker is embedded in the flue
# binary (recoverable via `flue extract-broker`), so it is not a separate
# release asset; this workflow still builds it (to the go:embed path),
# verifies the embed matches the build source, and sigstore-attests the
# broker (SLSA provenance in the GitHub attestation store) so anyone who
# extracts it can verify it was built by this workflow.
#
# Trigger: push a tag like `v1.2.3` (any tag matching `v*`).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # flue go:embeds the built broker (cmd/flue/embed.go), so the broker
      # must be built to its embed path before any package load succeeds.
      - name: Build broker (embed source)
        env:
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o cmd/flue/flue-broker.bin ./cmd/flue-broker
      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build broker (embed source)
        env:
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o cmd/flue/flue-broker.bin ./cmd/flue-broker
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  build:
    needs: [test]
    runs-on: ubuntu-latest
    # This job-level block replaces the top-level permissions for this job,
    # so it must list everything the job needs:
    #   actions: write         upload the build artifact
    #   contents: read        checkout the source
    #   id-token: write       mint the OIDC token exchanged for the Sigstore
    #                         signing certificate (Attest broker step)
    #   attestations: write   persist the attestation in GitHub's store
    permissions:
      actions: write
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          arch="${{ matrix.goarch }}"
          # The broker is built first, to the go:embed path, because flue
          # embeds it; consumers get it back via `flue extract-broker`,
          # so it is not published as a separate release asset.
          # The tag (minus the leading v) is stamped into both binaries,
          # shown by `flue version` / `flue-broker -version`.
          # GOARCH applies only to the release artifacts: the cross-built
          # flue cannot run on this runner when the matrix arch differs,
          # so a native-arch pair is built as well, for the verification
          # steps (which check the embed, not the arch).
          GOARCH="${arch}" go build -ldflags="-s -w -X main.version=${ver#v}" -o cmd/flue/flue-broker.bin ./cmd/flue-broker
          out="dist"
          mkdir -p "${out}"
          # The exact bytes that get embedded in this arch's flue, kept
          # aside for the attestation (the embed path is reused below
          # for the native verification build).
          cp cmd/flue/flue-broker.bin "${out}/flue-broker_${ver}_linux_${arch}"
          # Flat, version+arch-named release asset (no tgz wrapper):
          # download, chmod +x, run.
          GOARCH="${arch}" go build -ldflags="-s -w -X main.version=${ver#v}" -o "${out}/flue_${ver}_linux_${arch}" ./cmd/flue
          go build -ldflags="-s -w -X main.version=${ver#v}" -o cmd/flue/flue-broker.bin ./cmd/flue-broker
          go build -ldflags="-s -w -X main.version=${ver#v}" -o "${out}/flue-check" ./cmd/flue
      - name: Verify extract-broker identity
        run: |
          set -euo pipefail
          flue="dist/flue-check"
          # The broker embedded in flue must be the same binary as the
          # one built into it: extract it with a native build of the
          # same source and compare against the embed-source file's
          # sha256. (The release artifact for this arch is cross-built
          # and cannot run here; the embed identity is arch-independent.)
          # The Go tests only cover the embed blob, not the extracted
          # artifact.
          tmp="$(mktemp -d)"
          "${flue}" extract-broker "${tmp}/flue-broker"
          want="$(sha256sum cmd/flue/flue-broker.bin | awk '{print $1}')"
          got="$(sha256sum "${tmp}/flue-broker" | awk '{print $1}')"
          if [ "${want}" != "${got}" ]; then
            printf 'extract-broker does not match the embed source:\n  embed:     %s\n  extracted: %s\n' "${want}" "${got}"
            exit 1
          fi
          echo "extract-broker sha256 matches: ${got}"
      - name: Verify broker-sha256
        run: |
          set -euo pipefail
          flue="dist/flue-check"
          # The hash the binary reports for its own embed must match the
          # build-time embed source. Together with the extract check above,
          # the embed is tied to the source by two independent paths
          # (extract writes the bytes out, broker-sha256 hashes them
          # in-process).
          got="$("${flue}" broker-sha256)"
          want="$(sha256sum cmd/flue/flue-broker.bin | awk '{print $1}')"
          if [ "${got}" != "${want}" ]; then
            printf 'broker-sha256 does not match the embed source:\n  reported: %s\n  actual:   %s\n' "${got}" "${want}"
            exit 1
          fi
          echo "broker-sha256 matches the embed source: ${got}"
      - name: Attest broker
        uses: actions/attest@v4
        with:
          subject-path: ${{ github.workspace }}/dist/flue-broker_${{ github.ref_name }}_linux_${{ matrix.goarch }}
        # The broker is not a release asset, but it is still attested here —
        # in the job that built it — with a SLSA build-provenance predicate
        # signed by a short-lived Sigstore certificate (public-good instance
        # for this public repo). The attestation lands in GitHub's
        # attestation store, keyed by the file's sha256 digest, so a
        # consumer who recovers the broker from any flue binary can verify
        # it without the broker ever appearing in the release download list:
        #
        #   flue extract-broker ./flue-broker
        #   gh attestation verify ./flue-broker --source snugmo/flue
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flue_${{ github.ref_name }}_${{ matrix.goarch }}
          path: dist/flue_${{ github.ref_name }}_linux_${{ matrix.goarch }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      # Download the build artifacts the release is made from.
      actions: read
      contents: write
      # Required by create_attestations (the release job signs the
      # artifacts' attestation statements with the runner's OIDC token).
      id-token: write
      # Posting the attestation statements to GitHub's attestation store.
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: find artifacts -type f -exec mv {} . \;
      - name: Generate SHA256SUMS
        run: sha256sum flue_* > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flue_*
            SHA256SUMS
          generate_release_notes: true
          # Provenance statement embedded in the release notes (who/what
          # built this, from which commit and workflow run); attestation
          # statements for the assets (verifiable with gh attestation /
          # sigstore tools). Both require generate_release_notes.
          create_provenance: true
          create_attestations: true
